name: Pull Request
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Check
        run: ./go test:code:check
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Shared with main.yaml's test job — one repo-wide AWS apply at a time
    concurrency:
      group: aws-integration
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Install secrets tools
        run: ./scripts/ci/common/install-git-crypt.sh
      - name: Unlock git-crypt
        run: ./go git_crypt:unlock_with_encrypted_gpg_key
        env:
          ENCRYPTION_PASSPHRASE: ${{ secrets.ENCRYPTION_PASSPHRASE }}
      - name: Test
        run: ./scripts/ci/steps/test.sh
      - name: Dump terraform logs
        if: failure()
        continue-on-error: true
        run: cat build/logs/*.log
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  merge-pull-request:
    needs: [check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        uses: infrablocks/github-actions/asdf_install@v1
      - name: Merge pull request
        # [skip ci] stops the merge commit triggering a release build
        # PR title via env, never interpolated; --match-head-commit fails on a post-check push
        run: gh pr merge --merge --match-head-commit "$HEAD_SHA" "$PR_URL" --subject "$PR_TITLE [skip ci]"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify Slack
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./go "slack:notify[${{ job.status }}]"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
